<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>translate-tool 设置</title>
<style>
  body { font: 14px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 24px; max-width: 560px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .hint { color: #666; font-size: 12px; margin-bottom: 18px; }
  .row { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
  input[type=number], select, textarea { padding: 5px 7px; border: 1px solid #ccc; border-radius: 5px; font: inherit; width: 100%; box-sizing: border-box; }
  textarea { height: 70px; resize: vertical; }
  button { padding: 7px 14px; border: none; border-radius: 6px; background: #285ab4; color: #fff; cursor: pointer; font: inherit; }
  button.ghost { background: #eee; color: #333; }
  #status { color: #2a7; font-size: 13px; margin-left: 10px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1b1b1f; color: #ddd; }
    .hint { color: #999; }
    input, select, textarea { background: #26262b; border-color: #444; color: #ddd; }
    button.ghost { background: #333; color: #ddd; }
  }
</style>
</head>
<body>
  <h1>translate-tool</h1>
  <div class="hint">API Key、模型、术语表在桌面端设置。这里只管浏览器里的行为。</div>
  <div class="row"><label for="port">本地服务端口</label><input id="port" type="number" min="1024" max="65535" /></div>
  <div class="row"><label for="hoverModifier">悬停修饰键</label>
    <select id="hoverModifier"><option value="alt">Alt</option><option value="ctrl">Ctrl</option><option value="shift">Shift</option><option value="none">关闭悬停</option></select>
  </div>
  <div class="row"><label for="hoverDelayMs">悬停延时（毫秒）</label><input id="hoverDelayMs" type="number" min="80" max="3000" /></div>
  <div class="row"><label for="selectionIcon">选中后弹小图标</label><input id="selectionIcon" type="checkbox" style="width:auto" /></div>
  <div class="row"><label for="defaultDisplay">整页默认显示</label>
    <select id="defaultDisplay"><option value="bilingual">双语对照</option><option value="translation_only">仅译文</option></select>
  </div>
  <div class="row"><label for="disabledHosts">停用的站点</label><textarea id="disabledHosts" placeholder="每行一个域名，如&#10;example.com"></textarea></div>
  <p><button id="save">保存</button> <button id="check" class="ghost">检测桌面端</button><span id="status"></span></p>
  <script src="options.js"></script>
</body>
</html>
