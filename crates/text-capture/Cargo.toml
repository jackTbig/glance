[package]
name = "text-capture"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation_Collections"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading",
  "Win32_Graphics_Gdi",
] }
