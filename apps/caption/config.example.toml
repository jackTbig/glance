[audio]
energy_threshold = 0.01   # RMS 门限，越小越灵敏
silence_ms = 400          # 静音多久算一句结束
min_segment_ms = 300     # 说话 0.3 s 就发第一条中间识别
max_segment_ms = 6000    # 长于此就在最近的词间隙切开（不硬切，余下音频接着当下一段）
partial_every_ms = 300   # 说话过程中每 0.3 s 发一次中间识别（0 = 关闭逐字上屏）
device = ""              # 采集哪个播放设备（友好名，设置窗可选）；空 = 跟随系统默认，默认设备切换自动跟随

[asr]
model_path = 'D:\My_data\Claude\workspace\local-asr\ggml-large-v3-turbo-q5_0.bin'
models_dir = 'D:\models\whisper'   # 设置界面列出这里的 *.bin（已有 base.en / small.en / large-v3-turbo q8 与 fp16）
language = "en"
threads = 4
flash_attn = false        # 本机 Arc 核显实测开了反而慢
min_audio_ctx = 384       # whisper 编码窗下限（1500 = 30 s 全窗）；越小越快；320 以下短段会陷入幻觉循环，别再低
partial_window_ms = 5000  # 中间识别只解最近这么长的窗口（前面已定的文字用分段时间戳固定），0 = 每次重解整句
partial_model_path = 'D:\models\whisper\ggml-small.en.bin'   # 中间识别用的小模型，空 = 同主模型

[translate]
backend = "claude"        # claude | codex | openai（设置界面可切，立即生效）
claude_bin = 'C:\Users\13601\.local\bin\claude.exe'   # (Get-Command claude).Source 的结果
claude_model = "sonnet"   # 或 haiku / opus
codex_bin = "codex"
codex_model = ""          # 留空用 codex 默认
openai_base_url = "https://api.deepseek.com"   # 通义千问：https://dashscope.aliyuncs.com/compatible-mode/v1
openai_api_key = ""
openai_model = "deepseek-flash"
timeout_secs = 15         # claude 首句冷启动约 10 s，故不能设太短
rotate_every = 60         # claude 会话每 60 句轮换（提前 5 句预热备用会话，无感）
max_backlog = 10
partial_translate = true  # 说话过程中每来一条新的中间英文就翻成灰色临时中文（一次只飞一个）；定稿后整句重翻
context_sentences = 2     # 翻译时带最近 2 句英中对照当上下文

[ui]
font_size = 22.0
opacity = 0.75
font_path = 'C:\Windows\Fonts\msyh.ttc'
x = -1
y = -1
width = 1100
height = 120              # 最小高度；实际随内容在 [height, max_height] 内伸缩（下边缘固定向上长）
max_height = 480
lines = 2                 # 同时显示最近几段（悬停按钮 行+ / 行- 可调）
typewriter_cps = 0.0      # 打字机效果，每秒字符数；0 = 整句直出（默认，跟语音最紧）
auto_mini_secs = 20       # 多少秒没语音就缩成待机迷你条，0 = 不自动（悬停按钮"收起"/托盘菜单可手动）
auto_restore = true       # 有新语音时自动展开
hotkey_clickable = "Ctrl+Alt+C"
hotkey_passthrough = "Ctrl+Alt+P"

[paths]
transcripts_dir = "transcripts"
logs_dir = "logs"
