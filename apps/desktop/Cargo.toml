[package]
name = "translate-tool"
version.workspace = true
edition.workspace = true

[[bin]]
name = "translate-tool"
path = "src/main.rs"

# 只跑本地服务、不开界面：端到端测试与排障用
[[bin]]
name = "translate-tool-service"
path = "src/bin/service.rs"

# 运行环境自检（控制台）。界面起不来时正是最需要它的时候，所以单独做一个 bin
[[bin]]
name = "tt-doctor"
path = "src/bin/doctor.rs"

[lib]
name = "translate_tool"
path = "src/lib.rs"

[dependencies]
ai-translate = { path = "../../crates/ai-translate" }
offline-dict = { path = "../../crates/offline-dict" }
text-capture = { path = "../../crates/text-capture" }
desktop-shell = { path = "../../crates/desktop-shell" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
crossbeam-channel.workspace = true
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
global-hotkey = "0.8"
tray-icon = "0.24"
tiny_http = "0.12"
# 只用来跟字幕子进程的控制端点说话（回环、短超时）
reqwest.workspace = true
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
# 文件翻译（一期 docx / markdown / txt）
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
encoding_rs = "0.8"
chardetng = "0.1"
pulldown-cmark = { version = "0.12", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
# 把图标与版本信息编进 exe（资源表），这样文件管理器与任务栏都能看到
winresource = "0.1"

[dev-dependencies]
mock-llm = { path = "../../tests/mock-llm" }

[target.'cfg(windows)'.dependencies]
# 朗读：Windows.Media.SpeechSynthesis（WinRT 语音合成，和 Chrome 的 Web Speech 同一套引擎，
# 能拿到 OneCore 新音色；经典 SAPI5 只认老音色）。Media_Playback 用来放合成出来的音频流。
windows = { version = "0.62", features = ["Media_SpeechSynthesis", "Media_Core", "Media_Playback", "Storage_Streams", "Foundation"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Graphics_Gdi",
] }
raw-window-handle = "0.6"
windows-link = "0.1"
