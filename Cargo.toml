[workspace]
resolver = "2"
members = ["apps/desktop", "crates/ai-translate", "crates/text-capture", "tests/mock-llm"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
