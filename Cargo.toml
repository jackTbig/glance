[package]
name = "live-caption"
version = "0.1.0"
edition = "2021"

[lib]
name = "live_caption"
path = "src/lib.rs"

[[bin]]
name = "live-caption"
path = "src/main.rs"

[dependencies]
# glow（OpenGL）渲染器：wgpu 在本机 Arc 上不给带 alpha 的合成模式，透明窗会变成不透明黑底
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
wasapi = "0.24"
whisper-rs = { version = "0.16", features = ["vulkan"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
global-hotkey = "0.8"
tray-icon = "0.24"
# 托盘原生菜单自己弹（TPM_RETURNCMD 同步拿结果），不走 muda 的子类化转发
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Shell"] }
raw-window-handle = "0.6"
chrono = "0.4"
hound = "3.5"
# OpenAI 兼容后端（DeepSeek / 通义千问 / 自建网关 / Ollama），rustls 避开本机 schannel 的 TLS 问题
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
opt-level = 3
