[package]
name = "live-caption"
version = "0.1.0"
edition = "2021"

[lib]
name = "live_caption"
path = "src/lib.rs"

[[bin]]
name = "live-caption"
path = "src/main.rs"

[dependencies]
# glow（OpenGL）渲染器：wgpu 在本机 Arc 上不给带 alpha 的合成模式，透明窗会变成不透明黑底
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
wasapi = "0.24"
whisper-rs = { version = "0.16", features = ["vulkan"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
global-hotkey = "0.8"
chrono = "0.4"
hound = "3.5"

[profile.release]
opt-level = 3
